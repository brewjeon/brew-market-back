spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  config:
    import: optional:file:.env[.properties]
  flyway:
    default-schema: brew_market

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: brew_market
