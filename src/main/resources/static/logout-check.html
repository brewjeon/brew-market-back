<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>브루마켓 로그아웃 확인</title>
</head>
<body>
<h1>브루마켓 로그인 상태 확인</h1>

<p>
    <a href="/oauth2/authorization/google">구글 로그인</a>
    <a href="/auth/me">내 로그인 정보 확인</a>
</p>

<button id="logoutButton" type="button">로그아웃</button>
<p id="result" role="status"></p>

<hr>

<h2>게시글 등록 확인</h2>
<button id="createPostButton" type="button">
    예시 게시글 1건 등록
</button>
<p id="postResult" role="status"></p>

<script>
    // 버튼과 결과 안내 영역을 찾아 참조 보관
    const logoutButton = document.getElementById("logoutButton");
    const result = document.getElementById("result");

    logoutButton.addEventListener("click", async () => {
        // 요청이 끝나기 전에는 중복 클릭 방지
        logoutButton.disabled = true;
        result.textContent = "로그아웃 요청 중입니다.";

        try {
            // 현재 로그인 세션에서 사용할 CSRF 토큰 조회
            const csrfResponse = await fetch("/auth/csrf", {
                credentials: "same-origin",
                cache: "no-store"
            });

            if (csrfResponse.status === 401) {
                result.textContent = "먼저 로그인한 뒤 다시 시도해 주세요.";
                return;
            }

            if (!csrfResponse.ok) {
                result.textContent =
                    `CSRF 토큰 조회 실패: ${csrfResponse.status}`;
                return;
            }

            const csrf = await csrfResponse.json();

            // 서버가 알려준 헤더 이름에 토큰을 담아 로그아웃 요청
            const logoutResponse = await fetch("/logout", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    [csrf.headerName]: csrf.token
                }
            });

            if (logoutResponse.status !== 204) {
                result.textContent =
                    `로그아웃 요청 실패: ${logoutResponse.status}`;
                return;
            }

            // 로그아웃 후 보호된 경로에 다시 접근해서 인증 해제 확인
            const meResponse = await fetch("/auth/me", {
                credentials: "same-origin",
                cache: "no-store"
            });

            if (meResponse.status === 401) {
                result.textContent =
                    "로그아웃 완료: 204 / 회원 정보 접근 거부: 401";
            } else {
                result.textContent =
                    `로그아웃 응답은 204이지만 인증 해제 확인 필요: ${meResponse.status}`;
            }
        } catch (error) {
            // 서버 중단이나 연결 문제 등으로 응답을 받지 못한 상황
            result.textContent =
                "서버에 연결하지 못했습니다. 실행 상태를 확인해 주세요.";
        } finally {
            // 성공·실패·중간 반환 모두 버튼을 다시 사용할 수 있게 처리
            logoutButton.disabled = false;
        }
    });

    const createPostButton = document.getElementById("createPostButton");
    const postResult = document.getElementById("postResult");

    createPostButton.addEventListener("click", async () => {
        // 요청 중 중복 클릭 방지
        createPostButton.disabled = true;
        postResult.textContent = "등록 요청 중입니다.";

        try {
            // 로그인 세션에서 사용할 CSRF 토큰 조회
            const csrfResponse = await fetch("/auth/csrf", {
                credentials: "same-origin",
                cache: "no-store"
            });

            if (!csrfResponse.ok) {
                postResult.textContent =
                    `토큰 조회 실패: ${csrfResponse.status}. 로그인 상태를 확인해 주세요.`;
                return;
            }

            const csrf = await csrfResponse.json();

            // 판매자 번호는 보내지 않고 게시글 내용만 전달
            const response = await fetch("/posts", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({
                    title: "브루마켓 등록 확인용 머그컵",
                    description: "로그인한 회원의 게시글 저장 확인용입니다.",
                    price: 3000
                })
            });

            if (response.status !== 201) {
                postResult.textContent = `등록 실패: ${response.status}`;
                return;
            }

            const createdPost = await response.json();

            postResult.textContent =
                `등록 완료: 201 / 게시글 번호: ${createdPost.id}`;
        } catch (error) {
            postResult.textContent =
                "요청 처리 중 오류가 발생했습니다. 서버와 브라우저 오류를 확인해 주세요.";
        } finally {
            // 성공하거나 실패해도 버튼 다시 활성화
            createPostButton.disabled = false;
        }
    });
</script>
</body>
</html>
